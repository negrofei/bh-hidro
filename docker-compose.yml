# App only. Reuses the running bh-mysql-prod (schema bh_hidro, not fdc_database).
# Host CLI: DATABASE_HOST=127.0.0.1 DATABASE_PORT=3308 in .env
# Inside this container those two are overridden to the docker DNS name.

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: bh-hidro-app
    env_file:
      - .env
    environment:
      DATABASE_HOST: bh-mysql-prod
      DATABASE_PORT: 3306
      LOG_DIR: /logs
      DOWN_DIR: /descargas
      OUT_DIR: /output
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs
      - ./scripts:/app/scripts
      - descargas:/descargas
      - ./logs:/logs
      - output:/output
      # Tileserver reads this dir (prod: /var/www/liberagro/geodata/tiles).
      - ${TILES_HOST_DIR:-./output/tiles}:/output/tiles
    networks:
      - prod
    restart: unless-stopped
    command: ["tail", "-f", "/dev/null"]

networks:
  prod:
    name: ${DOCKER_NETWORK:-python3mysql_liberagro}
    external: true

volumes:
  descargas:
  output:
