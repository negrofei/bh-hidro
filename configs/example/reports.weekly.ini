[directorios]
down_dir = /descargas
log_dir = /logs

[region]
provincias = Entre Ríos|Buenos Aires|Córdoba|Santa Fe|Uruguay

[fechas]
fechaini = 20250101
fechafin = 20250107

[run]
# Fechas efectivas: --start-date / --end-date, o la ventana operativa.
operativo = True
paralelo = False
workers = 1
errors = False
max_tries = 2
checks = False
timeout = 10
erase = False
sleep_time = 60

[imerg]
imerg_calib = True
imerg_late = False
imerg_early = False
check_original = False
save_original = False
overwrite = False
interpolation = 0p1

[database]
chunk_size = 5000
interpolation_method = cdo
