[directorios]
down_dir = /descargas
log_dir = /logs

[region]
provincias = Entre Ríos|Buenos Aires|Córdoba|Santa Fe|Uruguay

[fechas]
fechaini = 20000101
fechafin = 20000130

[balance]
merge = True
noagr = False
by_dpto = False
resolution = 0p1

[run]
operativo = True
paralelo = True
workers = 7
errors = False
chunks_time = 10
chunks_formi = 10000
final_check_by_date = False
# True (operativo/default): no calcular si falta el día anterior.
# False: continuar desde el último balance cargado.
raise_if_data_gap = True

[cultivo]
tipo_cultivo = S1|TL|P

[data_providers]
precipitation_priority_0p1 = Imerg0p1,DatoERALand,WRF0p1,GFS0p1
etp_priority_0p1 = DatoERALand,WRF0p1,GFS0p1
